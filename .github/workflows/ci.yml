name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit + engine tests
        run: npm test

      - name: Compile all lesson sources
        run: npm run build:lessons

      - name: Docs examples, gallery, and cookbook all compile
        run: npm run dsl docs-check
