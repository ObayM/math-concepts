name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://mathly:mathly@localhost:5432/mathly
  BETTER_AUTH_SECRET: ci-only-secret-not-for-real-use
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  GEMINI_API_KEY: ci-placeholder-key
  CRON_SECRET: ci-cron-secret

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathly
          POSTGRES_PASSWORD: mathly
          POSTGRES_DB: mathly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Migrations apply cleanly to a fresh database
        run: npm run db:migrate

      - name: Isolated schema for the database tests
        run: npm run test:db:setup

      - name: Unit, component, API and database tests
        run: npm test

      - name: Compile all lesson sources
        run: npm run build:lessons

      - name: Docs examples, gallery, and cookbook all compile
        run: npm run dsl docs-check

      - name: Lesson content has no broken curves or unreachable answers
        run: npm run dsl verify

      - name: App builds
        run: npm run build

  smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathly
          POSTGRES_PASSWORD: mathly
          POSTGRES_DB: mathly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build

      # the only step that runs the app as a real server. catches a server
      # component that crashes at runtime, a prisma client that generates but
      # cannot connect, and a broken proxy matcher — none of which next build sees.
      - name: Boot the built app and curl the real routes
        run: |
          npm start &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:3000/login && break
            sleep 1
          done
          check() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1")
            echo "$1 -> $code (want $2)"
            [ "$code" = "$2" ] || exit 1
          }
          check /login 200
          check / 200
          check /signup 200
          check /api/health 200
          check "/api/check-username?username=someone" 200

          # gated routes must bounce, never 500
          gated() {
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:3000$1")
            echo "$1 -> $code (want a redirect)"
            case "$code" in 302 | 307) ;; *) exit 1 ;; esac
          }
          gated /dashboard
          gated /admin
          gated "/api/progress?lessonKey=limits-1"

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathly
          POSTGRES_PASSWORD: mathly
          POSTGRES_DB: mathly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Cache the browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
      - run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mathly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The image must carry compiled lessons, or a fresh deploy is empty
        run: |
          count=$(docker run --rm --entrypoint sh mathly:ci -c 'ls prisma/lessons/*.json | wc -l')
          echo "compiled lessons in image: $count"
          test "$count" -gt 50
