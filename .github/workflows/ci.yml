name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgresql://mathly:mathly@localhost:5432/mathly
  BETTER_AUTH_SECRET: ci-only-secret-not-for-real-use
  BETTER_AUTH_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  GEMINI_API_KEY: ci-placeholder-key

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mathly
          POSTGRES_PASSWORD: mathly
          POSTGRES_DB: mathly
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit + engine tests
        run: npm test

      - name: Compile all lesson sources
        run: npm run build:lessons

      - name: Docs examples, gallery, and cookbook all compile
        run: npm run dsl docs-check

      - name: Migrations apply cleanly to a fresh database
        run: npm run db:migrate

      - name: App builds
        run: npm run build
